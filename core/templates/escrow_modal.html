<!-- CoPay Escrow Code Modal Overlay -->
<div id="escrow-modal" class="fixed inset-x-0 bottom-0 top-16 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 px-4">
  
  <!-- Modal Card -->
  <div class="rounded-[1.5rem] p-6 md:p-8 max-w-md w-full relative shadow-2xl overflow-hidden" 
       style="background: #05080F; border: 1px solid rgba(255,255,255,0.1);">
    
    <!-- Modal Header -->
    <div class="flex justify-between items-center mb-6">
      <div>
        <span class="text-[10px] font-bold uppercase tracking-widest text-sky-400 block mb-1">Secure Verification</span>
        <h3 class="text-lg font-bold text-white">Enter Escrow Code</h3>
      </div>
    </div>

    <!-- 6-Box Character Input Form -->
    <form id="escrow-form" class="space-y-4 relative z-10" data-pool-id="{{ pool.pk }}">
      {% csrf_token %}
      
      <div>
        <label class="block text-xs uppercase tracking-wider text-white/60 mb-2 font-semibold">Escrow Code</label>
        
        <!-- 6 Mini Input Boxes Container -->
        <div class="flex justify-between gap-2" id="otp-container">
          <input type="text" maxlength="1" class="w-12 h-12 bg-white/[0.05] border border-white/10 rounded-xl text-center text-lg font-black font-mono text-white focus:outline-none focus:border-white/40 transition-all uppercase" autofocus required>
          <input type="text" maxlength="1" class="w-12 h-12 bg-white/[0.05] border border-white/10 rounded-xl text-center text-lg font-black font-mono text-white focus:outline-none focus:border-white/40 transition-all uppercase" required>
          <input type="text" maxlength="1" class="w-12 h-12 bg-white/[0.05] border border-white/10 rounded-xl text-center text-lg font-black font-mono text-white focus:outline-none focus:border-white/40 transition-all uppercase" required>
          <input type="text" maxlength="1" class="w-12 h-12 bg-white/[0.05] border border-white/10 rounded-xl text-center text-lg font-black font-mono text-white focus:outline-none focus:border-white/40 transition-all uppercase" required>
          <input type="text" maxlength="1" class="w-12 h-12 bg-white/[0.05] border border-white/10 rounded-xl text-center text-lg font-black font-mono text-white focus:outline-none focus:border-white/40 transition-all uppercase" required>
          <input type="text" maxlength="1" class="w-12 h-12 bg-white/[0.05] border border-white/10 rounded-xl text-center text-lg font-black font-mono text-white focus:outline-none focus:border-white/40 transition-all uppercase" required>
        </div>
        
        <p class="text-xs text-white/40 mt-2">Enter the 6-character escrow code provided by Payscrow to securely save it. Funds will be automatically released to the host upon service duration completion.</p>
      </div>

      <!-- Hidden input to store full combined code for form submission -->
      <input type="hidden" id="full-escrow-code" name="escrow_code">

      <!-- Status Message Area -->
      <div id="escrow-message" class="text-xs font-semibold hidden text-center"></div>

      <!-- Action Button (No Cancel/Close option) -->
      <div class="pt-4">
        <button type="submit" id="verify-escrow-btn" class="w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider text-center block transition-all hover:scale-[1.01] bg-white text-black shadow-lg">
          Save Escrow Code
        </button>
      </div>

    </form>

  </div>
</div>
<!-- AJAX and Auto-advance Script -->
<script>
  const inputs = document.querySelectorAll('#otp-container input');
  const hiddenInput = document.getElementById('full-escrow-code');
  const escrowForm = document.getElementById('escrow-form');
  const escrowMessage = document.getElementById('escrow-message');
  const verifyBtn = document.getElementById('verify-escrow-btn');

  inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.toUpperCase();
      e.target.value = val;

      if (val && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
      updateCombinedCode();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && index > 0) {
        inputs[index - 1].focus();
      }
    });
  });

  function updateCombinedCode() {
    let code = '';
    inputs.forEach(input => code += input.value);
    hiddenInput.value = code;
  }

  // Standalone AJAX Submission
  escrowForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const poolId = escrowForm.getAttribute('data-pool-id');
    const escrowCode = hiddenInput.value;

    if (escrowCode.length !== 6) {
      escrowMessage.textContent = "Please enter all 6 characters.";
      escrowMessage.className = "text-xs font-semibold text-rose-400 text-center";
      escrowMessage.classList.remove('hidden');
      return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = "Saving...";

    fetch(`/pool/${poolId}/save-escrow/`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
      },
      body: JSON.stringify({ escrow_code: escrowCode })
    })
    .then(response => response.json())
    .then(data => {
      if (data.status === 'success') {
        escrowMessage.textContent = data.message;
        escrowMessage.className = "text-xs font-semibold text-emerald-400 text-center";
        escrowMessage.classList.remove('hidden');
        setTimeout(() => {
          window.location.reload(); // Refresh or progress to next step
        }, 1500);
      } else {
        escrowMessage.textContent = data.message || "An error occurred.";
        escrowMessage.className = "text-xs font-semibold text-rose-400 text-center";
        escrowMessage.classList.remove('hidden');
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Save Escrow Code";
      }
    })
    .catch(error => {
      console.error('Error:', error);
      escrowMessage.textContent = "Network error. Please try again.";
      escrowMessage.className = "text-xs font-semibold text-rose-400 text-center";
      escrowMessage.classList.remove('hidden');
      verifyBtn.disabled = false;
      verifyBtn.textContent = "Save Escrow Code";
    });
  });
</script>
