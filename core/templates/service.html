{% extends 'navbar.html' %}

{% block content %}
<main class="min-h-screen text-white pt-24 pb-24" style="background: #05080F;">
  <div class="px-4 md:px-8 lg:px-16 max-w-3xl mx-auto w-full space-y-10">

    <!-- Page Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-white/10">
      <div>
        <p class="text-xs font-bold tracking-widest uppercase text-white/60">Service Catalog</p>
        <h1 class="text-3xl md:text-4xl font-black text-white">Create New Service</h1>
        <p class="text-xs text-white/50">Add a new subscription service offering to the platform catalog with pricing limits.</p>
      </div>
      <div>
        <a href="{% url 'admin_page' %}" class="px-4 py-2.5 rounded-xl text-xs font-bold bg-white/5 hover:bg-white/10 border border-white/10 text-white transition-all">
          Cancel
        </a>
      </div>
    </div>

    {% if messages %}
      <div class="space-y-3">
        {% for message in messages %}
          <div class="rounded-xl p-4 text-xs font-semibold flex items-center gap-3
                      {% if message.tags == 'error' %}bg-red-500/10 border border-red-500/30 text-red-300
                      {% elif message.tags == 'success' %}bg-emerald-500/10 border border-emerald-500/30 text-emerald-300
                      {% else %}bg-white/5 border border-white/10 text-white/70{% endif %}">
            <span class="w-2 h-2 rounded-full shrink-0
                         {% if message.tags == 'error' %}bg-red-400
                         {% elif message.tags == 'success' %}bg-emerald-400
                         {% else %}bg-white/40{% endif %}"></span>
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <!-- Creation Form Card -->
    <form method="POST" enctype="multipart/form-data" class="rounded-[2rem] p-6 md:p-10 space-y-6 shadow-2xl"
          style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);">
      {% csrf_token %}

      <!-- Service Name -->
      <div class="space-y-2">
        <label class="text-[10px] uppercase font-bold tracking-wider text-white/60 block">Service Name</label>
        <input type="text" name="name" placeholder="e.g., Netflix Premium, Spotify Family, YouTube Music"
               class="w-full bg-white/[0.03] border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-white/40 focus:outline-none focus:border-white/40 font-medium">
      </div>

      <!-- Category Dropdown (real choices from the model) -->
      <div class="space-y-2">
        <label class="text-[10px] uppercase font-bold tracking-wider text-white/60 block">Category</label>
        <div class="relative">
          <select name="category" class="w-full bg-[#0b1320] border border-white/10 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-white/40 appearance-none cursor-pointer">
            <option value="" disabled selected>Select service category...</option>
            {% for value, label in categories %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
          <div class="absolute right-4 top-3.5 text-white/40 pointer-events-none text-xs">▼</div>
        </div>
      </div>

      <!-- Two Column Layout: Standard Price & Max People -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Standard Price -->
        <div class="space-y-2">
          <label class="text-[10px] uppercase font-bold tracking-wider text-white/60 block">Standard Price (₦)</label>
          <input type="text" name="standard_price" placeholder="e.g., 3500.00"
                 class="w-full bg-white/[0.03] border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-white/40 focus:outline-none focus:border-white/40 font-mono">
        </div>

        <!-- Max People -->
        <div class="space-y-2">
          <label class="text-[10px] uppercase font-bold tracking-wider text-white/60 block">Max People (Pool Capacity)</label>
          <input type="number" name="max_people" placeholder="e.g., 4" min="1" max="20"
                 class="w-full bg-white/[0.03] border border-white/10 rounded-xl px-4 py-3 text-xs text-white placeholder-white/40 focus:outline-none focus:border-white/40 font-mono">
        </div>

      </div>

      <!-- Service Image Upload -->
      <div class="space-y-2">
        <label class="text-[10px] uppercase font-bold tracking-wider text-white/60 block">Service Image / Logo</label>
        <label for="service-image-input" class="block border-2 border-dashed border-white/10 rounded-2xl p-6 text-center bg-white/[0.01] hover:bg-white/[0.02] transition-colors cursor-pointer">
          <div class="space-y-2">
            <div class="w-10 h-10 mx-auto rounded-full bg-white/5 flex items-center justify-center text-white/60 text-lg">📁</div>
            <p id="image-upload-text" class="text-xs font-semibold text-white/80">Click to upload service image or drag and drop</p>
            <p class="text-[10px] text-white/40">SVG, PNG, JPG or WEBP (Max 2MB)</p>
          </div>
          <input type="file" id="service-image-input" name="image" accept="image/*" class="hidden">
        </label>
      </div>

      <!-- Submit Action Button -->
      <div class="flex justify-end pt-4 border-t border-white/10">
        <button type="submit" class="px-6 py-3 rounded-xl text-xs font-bold bg-white text-black hover:bg-white/90 transition-all shadow-xl">
          Publish Service
        </button>
      </div>

    </form>

  </div>
</main>

<script>
  const imageInput = document.getElementById('service-image-input');
  const imageText = document.getElementById('image-upload-text');
  imageInput.addEventListener('change', () => {
    if (imageInput.files.length > 0) {
      imageText.textContent = imageInput.files[0].name;
    }
  });
</script>
{% endblock %}
