<!-- 6. Security Card (Minimal) -->
<div class="rounded-[1.5rem] p-6 md:p-8 mt-6" style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);">
  <div class="mb-6">
    <h3 class="text-lg font-bold text-white">Security</h3>
    <p class="text-xs text-white/40 mt-1">Manage your account credentials.</p>
  </div>
  <div class="pt-2">
    <button onclick="openPasswordModal()" class="w-full py-3 rounded-xl font-bold text-xs text-center transition-all bg-white/5 hover:bg-white/10 border border-white/10 text-white block">
      Change Password
    </button>
  </div>
</div>

<!-- Change Password Modal Overlay Wrapper -->
<div id="password-modal-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 px-4 hidden">
  <div class="rounded-[1.5rem] p-6 md:p-8 max-w-md w-full relative shadow-2xl overflow-hidden" 
       style="background: #05080F; border: 1px solid rgba(255,255,255,0.1);">
       
    <!-- Close Button -->
    <button onclick="closePasswordModal()" class="absolute top-4 right-4 text-white/40 hover:text-white text-sm">✕</button>

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-lg font-bold text-white">Change Password</h3>
    </div>

    <!-- Password Form Content -->
    <div class="space-y-4">
      
      <!-- Old Password Input -->
      <div>
        <label class="block text-xs uppercase tracking-wider text-white/60 mb-2 font-semibold">Old Password</label>
        <input type="password" id="old-password-input" placeholder="Enter current password" 
               class="w-full px-4 py-3 rounded-xl text-sm font-semibold text-white placeholder:text-white/30 focus:outline-none focus:border-white/40 transition-all"
               style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
      </div>

      <!-- New Password Input -->
      <div>
        <label class="block text-xs uppercase tracking-wider text-white/60 mb-2 font-semibold">New Password</label>
        <input type="password" id="new-password-input" placeholder="Enter new password" 
               class="w-full px-4 py-3 rounded-xl text-sm font-semibold text-white placeholder:text-white/30 focus:outline-none focus:border-white/40 transition-all"
               style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
        <p class="text-[11px] text-white/40 mt-1">Must be at least 8 characters long and contain at least one digit.</p>
      </div>

      <!-- Feedback Response Display -->
      <div id="pwd-feedback-text" class="text-xs font-bold hidden"></div>

      <!-- Save Button -->
      <div class="pt-2">
        <button id="save-password-btn" onclick="submitPasswordChange()" class="w-full py-3.5 rounded-xl font-bold text-xs text-center block transition-all bg-white text-black shadow-lg">
          Update Password
        </button>
      </div>

    </div>
  </div>
</div>

<script>
  function openPasswordModal() {
    document.getElementById('password-modal-overlay').classList.remove('hidden');
    document.getElementById('old-password-input').value = "";
    document.getElementById('new-password-input').value = "";
    const feedback = document.getElementById('pwd-feedback-text');
    feedback.classList.add('hidden');
    
    const saveBtn = document.getElementById('save-password-btn');
    saveBtn.textContent = "Update Password";
    saveBtn.disabled = false;
  }

  function closePasswordModal() {
    document.getElementById('password-modal-overlay').classList.add('hidden');
  }

  async function submitPasswordChange() {
    const oldPassword = document.getElementById('old-password-input').value.trim();
    const newPassword = document.getElementById('new-password-input').value.trim();
    const feedback = document.getElementById('pwd-feedback-text');
    const saveBtn = document.getElementById('save-password-btn');

    feedback.classList.add('hidden');

    if (!oldPassword || !newPassword) {
      feedback.textContent = "All fields are required.";
      feedback.className = "text-xs font-bold text-rose-400";
      feedback.classList.remove('hidden');
      return;
    }

    // Client-side validation: 8+ characters and contains at least one digit
    const hasDigit = /\d/.test(newPassword);
    if (newPassword.length < 8 || !hasDigit) {
      feedback.textContent = "Password must be at least 8 characters long and contain at least one digit.";
      feedback.className = "text-xs font-bold text-rose-400";
      feedback.classList.remove('hidden');
      return;
    }

    saveBtn.textContent = "Updating...";
    saveBtn.disabled = true;

    try {
      const response = await fetch("{% url 'change_password' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie('csrftoken') // Re-uses your existing cookie function
        },
        body: JSON.stringify({
          old_password: oldPassword,
          new_password: newPassword
        })
      });
      const data = await response.json();

      if (response.ok && data.status) {
        feedback.textContent = data.message || "Password updated successfully!";
        feedback.className = "text-xs font-bold text-emerald-400";
        feedback.classList.remove('hidden');
        saveBtn.textContent = "Success!";
        
        setTimeout(() => {
          closePasswordModal();
        }, 1200);
      } else {
        feedback.textContent = data.message || "Failed to update password.";
        feedback.className = "text-xs font-bold text-rose-400";
        feedback.classList.remove('hidden');
        saveBtn.textContent = "Update Password";
        saveBtn.disabled = false;
      }
    } catch (err) {
      feedback.textContent = "An error occurred. Please try again.";
      feedback.className = "text-xs font-bold text-rose-400";
      feedback.classList.remove('hidden');
      saveBtn.textContent = "Update Password";
      saveBtn.disabled = false;
    }
  }
</script>
